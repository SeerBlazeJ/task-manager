[package]
name = "task_sorter"
version = "0.1.0"
authors = ["SeerBlazeJ <kaivanmehta957@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
burn = { version = "0.18", default-features = false, features = ["ndarray"] }
chrono = "0.4.42"
dioxus = { version = "0.6.0", features = ["router", "fullstack"] }
rusqlite = { version = "0.37.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
burn-ndarray = "0.18.0"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "rusqlite"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
